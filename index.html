<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>玉井感恩精舍 佛緣祈福打卡機</title>

<style>

body{
    margin:0;
    padding:20px;
    text-align:center;
    background:#f7f2dd;
    font-family:"Microsoft JhengHei",sans-serif;
}

h1{
    color:#9c7300;
    margin-bottom:10px;
}

h3{
    color:#666;
    font-weight:normal;
}

video,
canvas{
    width:95%;
    max-width:600px;
    border:4px solid #d4af37;
    border-radius:15px;
}

button{
    margin:10px;
    padding:15px 35px;
    font-size:22px;
    border:none;
    border-radius:12px;
    background:#ffd700;
    cursor:pointer;
}

button:hover{
    background:#f5c400;
}

#loading{
    display:none;
    font-size:24px;
    color:#9c7300;
    font-weight:bold;
    margin:20px;
}

</style>
</head>

<body>

<h1>🙏 佛緣祈福 🙏</h1>
<h3>台南玉井感恩精舍</h3>

<video
id="video"
autoplay
playsinline
muted>
</video>

<br>

<button id="photoBtn">
開始祈福拍攝
</button>

<div id="loading">
🙏 正在感應佛緣中...
</div>

<br>

<canvas id="canvas"></canvas>

<br>

<a id="downloadLink" style="display:none;">
    <button>
        下載祈福照
    </button>
</a>

<button
id="shareBtn"
style="display:none;">
分享祈福照
</button>

<script>

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

navigator.mediaDevices
.getUserMedia({
    video:true
})
.then(function(stream){

    video.srcObject = stream;

})
.catch(function(error){

    alert(
      "相機啟動失敗："+
      error.message
    );

});

document
.getElementById("photoBtn")
.addEventListener(
"click",
capturePhoto
);

function capturePhoto(){

    if(video.videoWidth===0){

        alert("請等待相機啟動完成");

        return;
    }

    document
    .getElementById("loading")
    .style.display="block";

    setTimeout(function(){

        document
        .getElementById("loading")
        .style.display="none";

        canvas.width =
        video.videoWidth;

        canvas.height =
        video.videoHeight;

        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );

        // ===== 柔光佛光 =====


       const sparkle = new Image();

sparkle.onload = function(){

    ctx.globalAlpha = 0.45;

    ctx.drawImage(
        sparkle,
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.globalAlpha = 1;

    drawTextAndLogo();

};

sparkle.src = "sparkles.png";
    const x =
    Math.random()*canvas.width;

    const y =
    Math.random()*canvas.height;

    const size =
    Math.random()*3+1;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        size,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
    "rgba(255,240,200,0.35)";

    ctx.fill();
}

        const cards=[

            ["88","善念常存"],
            ["92","福德增長"],
            ["95","廣結善緣"],
            ["98","吉祥圓滿"],
            ["100","佛光普照"]

        ];

        const result =
        cards[
            Math.floor(
                Math.random()*cards.length
            )
        ];
const infoX =
canvas.width / 2;

const scoreY =
canvas.height - 140;

const textY =
canvas.height - 100;

const templeY =
canvas.height - 60;

const dateY =
canvas.height - 25;
        ctx.textAlign="center";
        ctx.shadowColor =
"rgba(255,215,0,0.8)";

ctx.shadowBlur = 20;

ctx.strokeStyle="#c89b00";
    ctx.lineWidth = 8;

        ctx.fillStyle="white";
        ctx.font="bold 48px sans-serif";
ctx.fillStyle="red";

ctx.fillText(
    "TEST",
    canvas.width/2,
    100
);
        ctx.strokeText(
    "🙏 佛緣指數 " + result[0],
    infoX,
    scoreY
);

ctx.fillText(
    "🙏 佛緣指數 " + result[0],
    infoX,
    scoreY
);

        ctx.fillStyle="white";
        ctx.font="bold 34px sans-serif";

        ctx.strokeText(
    result[1],
    infoX,
    textY
);

ctx.fillText(
    result[1],
    infoX,
    textY
);

        ctx.font="28px DFKai-SB";


        ctx.strokeText(
    "感恩精舍祝您新春愉快",
    infoX,
    templeY
);

ctx.fillText(
    "感恩精舍祝您新春愉快",
    infoX,
    templeY
);

        const today =
        new Date().toLocaleDateString();

        ctx.font="22px sans-serif";

        ctx.strokeText(
    today,
    infoX,
    dateY
);

ctx.fillText(
    today,
    infoX,
    dateY
);

        // ===== Logo =====

        const logo = new Image();

        logo.onload = function(){

            ctx.save();

ctx.globalAlpha = 0.75;

ctx.filter =
"sepia(100%) saturate(800%) hue-rotate(-50deg)";

ctx.drawImage(
    logo,
    20,
    canvas.height-95,
    70,
    70
);

ctx.restore();

            finishImage();

        };

        logo.onerror = function(){

            finishImage();

        };

        logo.src="logo.png";

        function finishImage(){

            // 金色外框

            ctx.strokeStyle="gold";

            ctx.lineWidth=14;

            ctx.strokeRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            const link =
            document.getElementById(
                "downloadLink"
            );

            link.href =
            canvas.toDataURL(
                "image/png"
            );

            link.download =
            "感恩精舍祈福照.png";

            link.style.display =
            "inline-block";

            document
            .getElementById(
                "shareBtn"
            )
            .style.display=
            "inline-block";
        }

    },3500);

}

document
.getElementById("shareBtn")
.addEventListener(
"click",
sharePhoto
);

async function sharePhoto(){

    try{

        const response =
        await fetch(
            canvas.toDataURL("image/png")
        );

        const blob =
        await response.blob();

        const file =
        new File(
            [blob],
            "感恩精舍祈福照.png",
            {
                type:"image/png"
            }
        );

        if(navigator.share){

            await navigator.share({
                title:"感恩精舍祈福照",
                text:"我在玉井感恩精舍完成佛緣打卡",
                files:[file]
            });

        }else{

            alert("此裝置不支援分享功能");

        }

    }catch(e){

        console.log(e);

    }

}

</script>

</body>
</html>
