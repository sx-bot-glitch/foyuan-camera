<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>感恩精舍 - 佛緣感應拍照打卡</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        /* 主畫面容器 */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        /* 初始歡迎畫面 */
        #start-screen {
            position: absolute;
            inset: 0;
            z-index: 30;
            background: radial-gradient(circle, #3a2312 0%, #140b05 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        #start-screen img {
            max-width: 80%;
            max-height: 55vh;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(255, 200, 100, 0.3);
            margin-bottom: 30px;
            object-fit: contain;
        }
        /* 按鈕樣式 */
        .btn {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #4a2500;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(253, 160, 133, 0.4);
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        /* 感應中過場畫面 */
        #loading-screen {
            position: absolute;
            inset: 0;
            z-index: 25;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .pulse-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 3px;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        /* 相機與圖框預覽區 */
        #camera-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* 前鏡頭鏡像翻轉 */
        .mirror {
            transform: scaleX(-1);
        }
        #frame-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            z-index: 10;
        }
        /* 底部控制列 */
        .controls {
            position: absolute;
            bottom: 30px;
            z-index: 20;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .sub-btn {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(5px);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
        }
        /* 拍照結果畫面 */
        #result-screen {
            position: absolute;
            inset: 0;
            z-index: 35;
            background: #111;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #captured-photo {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 12px;
            border: 2px solid #ffd700;
            margin-bottom: 20px;
        }
        .tip-text {
            font-size: 0.95rem;
            color: #ccc;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 初始畫面 -->
    <div id="start-screen">
        <!-- 首頁封面圖支援 cover.gif 或 cover.png (若無此圖會自動隱藏) -->
        <img id="cover-img" src="cover.gif" alt="佛緣感應封面" onerror="if(this.src.endsWith('.gif')){this.src='cover.png'}else{this.style.display='none'}">
        <h2 style="color: #ffd700; margin-bottom: 25px;">✨ 測測您的新春佛緣指數 ✨</h2>
        <button class="btn" onclick="startSensing()">開始感應</button>
    </div>

    <!-- 2. 佛緣感應中 (3.5秒) -->
    <div id="loading-screen">
        <div class="pulse-text">🙏 佛緣感應中...</div>
    </div>

    <!-- 3. 相機與圖框畫面 -->
    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <img id="frame-overlay" src="" alt="佛緣圖框">
        
        <div class="controls">
            <button class="sub-btn" onclick="switchCamera()">🔄 翻轉鏡頭</button>
            <button class="btn" onclick="takePhoto()">📸 拍照留念</button>
            <button class="sub-btn" onclick="resetAll()">重新感應</button>
        </div>
    </div>

    <!-- 4. 拍照結果與下載畫面 -->
    <div id="result-screen">
        <img id="captured-photo" src="" alt="拍照結果">
        <p class="tip-text">💡 手機請「長按圖片」儲存，或點擊下方按鈕下載</p>
        <div style="display: flex; gap: 15px;">
            <a id="download-link" class="btn" download="佛緣感應打卡.png" style="text-decoration: none;">⬇️ 下載照片</a>
            <button class="sub-btn" onclick="retakePhoto()">重拍一張</button>
        </div>
    </div>
</div>

<!-- 用於合成照片的隱藏畫布 -->
<canvas id="canvas" style="display: none;"></canvas>

<script>
    // ==========================================
    // 圖片設定區：已全數修改為 .gif 格式
    // ==========================================
    const frames = [
        { vertical: 'pic1_L.gif', horizontal: 'pic1.gif' }, // 第1組
        { vertical: 'pic2_L.gif', horizontal: 'pic2.gif' }, // 第2組
        { vertical: 'pic3_L.gif', horizontal: 'pic3.gif' }, // 第3組
        { vertical: 'pic4_L.gif', horizontal: 'pic4.gif' }, // 第4組
        { vertical: 'pic5_L.gif', horizontal: 'pic5.gif' }  // 第5組
    ];

    let selectedFrameIndex = 0;
    let currentStream = null;
    let useFrontCamera = true; // 預設開啟前鏡頭自拍

    const video = document.getElementById('video');
    const frameOverlay = document.getElementById('frame-overlay');
    const startScreen = document.getElementById('start-screen');
    const loadingScreen = document.getElementById('loading-screen');
    const cameraContainer = document.getElementById('camera-container');
    const resultScreen = document.getElementById('result-screen');

    // 點擊「開始感應」
    async function startSensing() {
        await initCamera();

        startScreen.style.display = 'none';
        loadingScreen.style.display = 'flex';

        // 隨機抽出 0 ~ 4 的其中一種結果
        selectedFrameIndex = Math.floor(Math.random() * frames.length);

        // 等待 3.5 秒 (3500 毫秒)
        setTimeout(() => {
            loadingScreen.style.display = 'none';
            cameraContainer.style.display = 'flex';
            updateFrameOrientation();
        }, 3500);
    }

    // 啟動相機
    async function initCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        const constraints = {
            video: {
                facingMode: useFrontCamera ? 'user' : 'environment',
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            },
            audio: false
        };

        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = currentStream;
            if (useFrontCamera) {
                video.classList.add('mirror');
            } else {
                video.classList.remove('mirror');
            }
        } catch (err) {
            alert('無法開啟相機，請確認瀏覽器已允許相機權限，並使用 HTTPS 網址開啟。');
            console.error(err);
        }
    }

    // 切換前後鏡頭
    async function switchCamera() {
        useFrontCamera = !useFrontCamera;
        await initCamera();
    }

    // 根據手機直拿或橫拿，自動切換直式(_L.gif)或橫式(.gif)圖框
    function updateFrameOrientation() {
        const isLandscape = window.innerWidth > window.innerHeight;
        const chosenSet = frames[selectedFrameIndex];
        frameOverlay.src = isLandscape ? chosenSet.horizontal : chosenSet.vertical;
    }

    // 監聽螢幕旋轉事件
    window.addEventListener('resize', () => {
        if (cameraContainer.style.display === 'flex') {
            updateFrameOrientation();
        }
    });

    // 拍照並合成圖框
    function takePhoto() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // 設定畫布解析度與目前螢幕比例一致
        const width = cameraContainer.clientWidth;
        const height = cameraContainer.clientHeight;
        canvas.width = width;
        canvas.height = height;

        // 計算 video 滿版裁切比例
        const videoRatio = video.videoWidth / video.videoHeight;
        const screenRatio = width / height;
        let drawWidth, drawHeight, startX, startY;

        if (videoRatio > screenRatio) {
            drawHeight = height;
            drawWidth = height * videoRatio;
            startX = (width - drawWidth) / 2;
            startY = 0;
        } else {
