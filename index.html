<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相機測試</title>
</head>

<body style="text-align:center;">

<h1>相機測試</h1>

<video
id="video"
autoplay
playsinline
style="width:600px;border:3px solid red;">
</video>

<script>

const video =
document.getElementById("video");

navigator.mediaDevices
.getUserMedia({
    video:true
})
.then(function(stream){

    alert("相機連線成功");

    video.srcObject = stream;

})
.catch(function(error){

    alert(
      "相機錯誤：" +
      error.message
    );

});

</script>

</body>
</html>
