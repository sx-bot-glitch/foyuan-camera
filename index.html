<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>佛緣相機</title>

<style>

body{
    margin:0;
    font-family:"Microsoft JhengHei";
    text-align:center;
    background:#f5f0d8;
}

h1{
    color:#8a6d00;
    margin-top:30px;
}

video{
    width:90%;
    max-width:500px;
    border-radius:15px;
    margin-top:20px;
}

canvas{
    width:90%;
    max-width:500px;
    border-radius:15px;
    margin-top:20px;
}

button{
    margin:10px;
    padding:15px 30px;
    font-size:20px;
    background:#ffd700;
    border:none;
    border-radius:10px;
}

#result{
    font-size:30px;
    color:#8a6d00;
    margin-top:20px;
}

</style>
</head>

<body>

<h1>🙏 佛緣相機 🙏</h1>

<video id="video" autoplay playsinline></video>

<br>

<button onclick="takePhoto()">
拍照
</button>

<button onclick="testFate()">
測佛緣
</button>

<div id="result"></div>

<br>

<canvas id="canvas"></canvas>

<script>

const video = document.getElementById('video');

navigator.mediaDevices.getUserMedia({
    video:true
})
.then(stream=>{
    video.srcObject=stream;
});

function takePhoto(){

    const canvas =
        document.getElementById('canvas');

    const ctx =
        canvas.getContext('2d');

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

}

function testFate(){

    const score =
        Math.floor(Math.random()*21)+80;

    document.getElementById("result").innerHTML=
        "佛緣指數："+score+"分";

}

</script>

</body>
</html>
