<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>感恩精舍 - 佛緣感應拍照打卡</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        /* 主畫面容器（永遠顯示相機） */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            overflow: hidden;
        }
        /* 即時自拍鏡頭 */
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .mirror {
            transform: scaleX(-1);
        }
        /* 佛緣圖框覆蓋層（感應完成後才顯示） */
        #frame-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            z-index: 10;
            display: none;
        }
        /* 右上角翻轉鏡頭小按鈕（初始與拍照時皆可使用） */
        #top-switch-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 25;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(5px);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            font-size: 0.95rem;
            border-radius: 30px;
            cursor: pointer;
        }
        /* 右下角紅色「開始感應」圓形按鈕（還原您的設計圖） */
        #start-btn-wrapper {
            position: absolute;
            right: 28px;
            bottom: 35px;
            z-index: 20;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s;
        }
        #start-btn-wrapper:active {
            transform: scale(0.92);
        }
        .red-circle-btn {
            position: relative;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 30%, #ff4d4d 0%, #d91e18 65%, #960000 100%);
            border: 6px solid #b5b5b5;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5), inset 0 2px 6px rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 900;
            font-size: 1.25rem;
            line-height: 1.15;
            letter-spacing: 1px;
        }
        /* 按鈕上半部白色反光高光 */
        .red-circle-btn::before {
            content: "";
            position: absolute;
            top: 4px;
            left: 16%;
            width: 68%;
            height: 36%;
            border-radius: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.85), rgba(255,255,255,0.1));
            pointer-events: none;
        }
        /* 點擊提示手指與波紋動畫 */
        .tap-finger {
            position: absolute;
            right: -12px;
            bottom: -18px;
            font-size: 2.3rem;
            transform: rotate(-20deg);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            animation: fingerTap 1.4s infinite ease-in-out;
            pointer-events: none;
        }
        @keyframes fingerTap {
            0%, 100% { transform: rotate(-20deg) scale(1); }
            50% { transform: rotate(-20deg) scale(0.88) translate(-3px, -3px); }
        }
        /* 3.5秒「佛緣感應中...」半透明遮罩（背景仍看得到自己） */
        #loading-overlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(2px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .pulse-text {
            font-size: 2rem;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
            letter-spacing: 3px;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(0.96); }
            50% { opacity: 1; transform: scale(1.06); }
        }
        /* 感應完成後的底部拍照控制列 */
        #photo-controls {
            position: absolute;
            bottom: 30px;
            z-index: 20;
            display: none;
            gap: 15px;
            align-items: center;
        }
        .action-btn {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #4a2500;
            border: none;
            padding: 14px 34px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .sub-btn {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(5px);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.6);
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
        }
        /* 拍照結果與下載畫面 */
        #result-screen {
            position: absolute;
            inset: 0;
            z-index: 40;
            background: #111;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #captured-photo {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 12px;
            border: 2px solid #ffd700;
            margin-bottom: 18px;
        }
        .tip-text {
            font-size: 0.95rem;
            color: #ddd;
            margin-bottom: 15px;
            text-align: center;
        }
        /* 若相機未自動開啟時的備用啟動提示 */
        #camera-permission-tip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            text-align: center;
            color: #ccc;
            display: none;
        }
    </style>
</head>
<body>

<div class="container" id="camera-container">
    <!-- 相機權限備用提示 -->
    <div id="camera-permission-tip">
        <p style="margin-bottom: 12px;">📷 需要開啟相機才能自拍打卡</p>
        <button class="sub-btn" onclick="initCamera()">點此開啟相機</button>
    </div>

    <!-- 1. 即時自拍畫面 -->
    <video id="video" autoplay playsinline muted></video>

    <!-- 2. 隨機抽出的佛緣圖框 -->
    <img id="frame-overlay" src="" alt="佛緣圖框">

    <!-- 右上角翻轉鏡頭 -->
    <button id="top-switch-btn" type="button">🔄 翻轉鏡頭</button>

    <!-- 3. 初始狀態：右下角紅色「開始感應」圓形按鈕 -->
    <div id="start-btn-wrapper" role="button" aria-label="開始感應">
        <div class="red-circle-btn">
            <span>開始</span>
            <span>感應</span>
        </div>
        <div class="tap-finger">👆</div>
    </div>

    <!-- 4. 感應中過場提示 (3.5秒) -->
    <div id="loading-overlay">
        <div class="pulse-text">🙏 佛緣感應中...</div>
    </div>

    <!-- 5. 感應完成後：底部拍照與重新感應列 -->
    <div id="photo-controls">
        <button id="btn-capture" class="action-btn" type="button">📸 拍照留念</button>
        <button id="btn-reset" class="sub-btn" type="button">重新感應</button>
    </div>

    <!-- 6. 拍照結果與下載畫面 -->
    <div id="result-screen">
        <img id="captured-photo" src="" alt="拍照結果">
        <p class="tip-text">💡 手機請「長按圖片」儲存，或點擊下方按鈕下載</p>
        <div style="display: flex; gap: 15px;">
            <a id="download-link" class="action-btn" download="佛緣感應打卡.png" style="text-decoration: none;">⬇️ 下載照片</a>
            <button id="btn-retake" class="sub-btn" type="button">重拍一張</button>
        </div>
    </div>
</div>

<canvas id="canvas" style="display: none;"></canvas>

<script>

    ];

    let selectedFrameIndex = 0;
    let currentStream = null;
    let useFrontCamera = true;
    let cameraReady = false;
    let hasSensed = false;

    const video = document.getElementById('video');
    const frameOverlay = document.getElementById('frame-overlay');
    const startBtnWrapper = document.getElementById('start-btn-wrapper');
    const loadingOverlay = document.getElementById('loading-overlay');
    const photoControls = document.getElementById('photo-controls');
    const resultScreen = document.getElementById('result-screen');
    const cameraContainer = document.getElementById('camera-container');
    const permissionTip = document.getElementById('camera-permission-tip');

    // 網頁一載入，立刻啟動前置自拍相機
    window.addEventListener('DOMContentLoaded', () => {
        initCamera();
    });

    // 綁定所有按鈕事件
    startBtnWrapper.addEventListener('click', startSensing);
    document.getElementById('top-switch-btn').addEventListener('click', switchCamera);
    document.getElementById('btn-capture').addEventListener('click', takePhoto);
    document.getElementById('btn-reset').addEventListener('click', resetSensing);
    document.getElementById('btn-retake').addEventListener('click', retakePhoto);

    // 啟動相機
    async function initCamera() {
